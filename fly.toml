# Plan Listen sur Fly.io. Une seule machine : les messages en direct et le fichier de données
# vivent dans ce processus, deux machines se contrediraient.
app = "listen-festival"
primary_region = "cdg"   # Paris

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_FILE = "/data/db.json"
  TRUST_PROXY = "1"

[[mounts]]
  source = "listen_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
