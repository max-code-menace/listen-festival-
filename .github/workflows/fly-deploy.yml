# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      - master
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    name: Deploy app
    needs: test               # rien n'est mis en ligne si un test échoue
    runs-on: ubuntu-latest
    concurrency: deploy-group # un seul déploiement à la fois
    steps:
      - uses: actions/checkout@v4
      # Version figée (1.6) : une mise à jour de l'action ne peut pas casser le déploiement à notre insu
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # --ha=false : une seule machine, sinon les messages et positions se dédoublent.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
